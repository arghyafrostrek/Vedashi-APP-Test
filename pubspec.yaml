name: vedashi
description: Vedashi - Natural Wellness E-commerce App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^13.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0

  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
